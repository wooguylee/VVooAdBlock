<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VVoo AdBlock</title>
  <link rel="stylesheet" href="popup.css">
  <script src="shorts-store.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header><img src="icons/32.png" width="24" height="24" alt=""><strong>VVoo AdBlock</strong></header>
  <main>
    <p class="site-label">현재 사이트</p>
    <h1 id="host">확인 중…</h1>
    <button id="toggle" type="button" role="switch" aria-checked="false" disabled>
      <span>이 사이트에서 광고 차단</span>
      <span class="track" aria-hidden="true"><span></span></span>
    </button>
    <p id="notice" role="status"></p>
    <button id="reload" type="button" hidden>탭 새로고침</button>
    <section id="current-short" hidden>
      <span class="site-label">현재 쇼츠</span>
      <p id="short-title"></p>
      <button id="select-short" type="button"></button>
    </section>
    <details id="manage-shorts">
      <summary>쇼츠 차단 목록 <span id="short-count"></span></summary>
      <form id="short-form">
        <label for="short-url">차단할 쇼츠 링크</label>
        <div class="row"><input type="url" id="short-url" required placeholder="https://www.youtube.com/shorts/…"><button>추가</button></div>
      </form>
      <ul id="short-list"></ul>
    </details>
    <details id="short-debug" hidden>
      <summary>쇼츠 피드 진단</summary>
      <button id="record-shorts" type="button">기록 시작</button>
      <button id="refresh-log" type="button">기록 보기</button>
      <textarea id="short-log" aria-label="피드 진단 기록" readonly hidden></textarea>
    </details>
    <p id="short-status" role="status"></p>
  </main>
</body>
</html>
